<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>高一物理 · 课堂点名台</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:320px;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#eaf4ff;background:#07152b}.app{min-height:100vh;padding:28px clamp(18px,5vw,72px);background:radial-gradient(circle at 50% 37%,#174b83,#0a2853 37%,#06152d 78%)}.top,.board,footer{max-width:1300px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.mark{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#28c8ff,#496af2);font-size:23px;box-shadow:0 8px 25px #14a9ff5a}.eyebrow{margin:0;color:#86c6fa;font-size:11px;font-weight:bold;letter-spacing:.15em}.brand h1{font-size:18px;margin:4px 0}.chip{background:#0d3663b3;border:1px solid #7cc5ff4a;border-radius:30px;padding:8px 12px;font-size:13px;color:#c4e3ff}.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#63f4ac;margin-right:6px;box-shadow:0 0 10px #63f4ac}.board{display:grid;grid-template-columns:220px 1fr 310px;gap:18px}.panel{background:linear-gradient(145deg,#174575d9,#071f44d4);border:1px solid #8ecfff36;border-radius:22px;box-shadow:0 22px 55px #00091f63;backdrop-filter:blur(10px)}.left{display:flex;flex-direction:column;gap:15px}.card{padding:19px}.label{font-size:11px;letter-spacing:.12em;color:#86bbe9;font-weight:bold}.card strong{display:block;margin:10px 0 5px;font-size:15px}.muted{color:#92b8dd;font-size:12px;line-height:1.7}.progress-title{display:flex;justify-content:space-between;font-size:14px}.progress-title b{color:#62d9ff}.track{height:7px;border-radius:8px;background:#061830;margin:14px 0 9px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#1bd2ff,#737cff);box-shadow:0 0 10px #32cbff;transition:.3s}.center{min-height:610px;text-align:center;padding:22px;display:flex;flex-direction:column;align-items:center}.head{width:100%;display:flex;justify-content:space-between;color:#9dcef7;font-size:13px}.atom{width:282px;height:286px;position:relative;display:grid;place-items:center;margin:16px 0}.ring{position:absolute;width:240px;height:91px;border:1px solid #66d8ff89;border-radius:50%;box-shadow:0 0 15px #45bdff30}.r2{transform:rotate(60deg)}.r3{transform:rotate(-60deg)}.ball{width:125px;height:125px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#2c6baa,#092954);box-shadow:0 0 0 9px #1b57915c,0 0 45px #19a9ef66;z-index:1}.avatar{width:98px;height:98px;border-radius:50%;display:grid;place-items:center;border:4px solid #a8e5ff;background:linear-gradient(135deg,#8f87ff,#4763ce);font-size:42px;font-weight:bold;box-shadow:0 7px 22px #06172d}.avatar.empty{font-size:32px;background:#124477;color:#a5e4ff}.electron{position:absolute;width:10px;height:10px;border-radius:50%;background:#8cecff;box-shadow:0 0 15px #55deff}.e1{top:40px;left:26px}.e2{bottom:42px;right:25px;background:#a9a6ff}.e3{top:57px;right:33px;background:#80ffad}.picking .ring{animation:spin .8s linear infinite}.picking .r2{animation-direction:reverse}.copy p{font-size:12px;color:#7eb9e9;margin:0}.copy h2{font-size:28px;margin:7px 0}.copy span{font-size:12px;color:#98bddc}.pick{border:0;cursor:pointer;margin-top:26px;padding:14px 27px;border-radius:13px;color:#fff;background:linear-gradient(100deg,#1bbdf9,#576df7);font-weight:bold;font-size:15px;box-shadow:0 11px 24px #177df469}.pick:disabled{opacity:.55;cursor:wait}.reset{border:0;background:none;color:#8db8de;margin-top:13px;cursor:pointer;font-size:12px}.roster{padding:20px 14px}.roster-head{display:flex;justify-content:space-between;align-items:center;padding:0 5px 13px}.roster h2{font-size:16px;margin:4px 0}.count{font-size:12px;color:#93c3ea}.upload{display:block;border:1px dashed #79c9ff7d;background:#133d694c;color:#b3dcfc;border-radius:10px;text-align:center;padding:9px;cursor:pointer;font-size:12px}.upload input{display:none}.note{height:18px;margin:5px 0 0;color:#70efb4;text-align:center;font-size:11px}.legend{border-top:1px solid #88c3f12b;margin-top:7px;padding:10px 5px;color:#82acd5;font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#607b9e;margin-right:4px}.dot.yes{background:#5af0ae;box-shadow:0 0 7px #5af0ae;margin-left:10px}.list{max-height:458px;overflow:auto}.student{border:1px solid transparent;background:none;width:100%;padding:8px 6px;color:#e6f3ff;display:flex;align-items:center;gap:9px;text-align:left;border-radius:10px;cursor:pointer}.student:hover,.student.active{background:#2b78c436;border-color:#75b8f13b}.mini{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#8c8bff,#3762bd);font-size:13px;font-weight:bold}.name{flex:1;font-size:13px}.name small{display:block;color:#78a3cc;font-size:10px;margin-top:2px}.status{font-size:11px;color:#789fc4}.status.yes{color:#65ecad}footer{text-align:center;color:#6698c4;font-size:11px;letter-spacing:.08em;margin-top:17px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:980px){.board{grid-template-columns:1fr 1fr}.left{grid-row:span 2}.roster{min-height:0}}@media(max-width:650px){.app{padding:17px 12px}.chip{display:none}.board{grid-template-columns:1fr}.left{display:grid;grid-template-columns:1fr 1fr}.center{min-height:520px}.atom{transform:scale(.85);margin:-4px 0}.list{max-height:350px}}
  </style>
</head>
<body><main class="app"><header class="top"><div class="brand"><div class="mark">⚛</div><div><p class="eyebrow">PHYSICS · 2026</p><h1>高一物理 · 点名台</h1></div></div><div class="chip"><i></i>高一（3）班</div></header><section class="board"><aside class="left"><div class="panel card"><div class="label">今日课程</div><strong>9月5日 · 周六</strong><div class="muted">第 3 节 · 09:50 — 10:35</div></div><div class="panel card"><div class="progress-title"><span>点名进度</span><b id="progressText">0 / 0</b></div><div class="track"><i id="progressBar"></i></div><div class="muted">还有 <b id="remaining">0</b> 位同学待点名</div></div></aside><section class="panel center"><div class="head"><span>✦ 随机抽取</span><span>物理课堂</span></div><div id="atom" class="atom"><i class="ring"></i><i class="ring r2"></i><i class="ring r3"></i><i class="electron e1"></i><i class="electron e2"></i><i class="electron e3"></i><div class="ball"><div id="avatar" class="avatar empty">✦</div></div></div><div class="copy"><p id="caption">准备开始点名</p><h2 id="chosen">从全班同学中抽取</h2><span id="detail">点击下方按钮，随机点到一位同学</span></div><button id="pick" class="pick">✦ 开始随机点名</button><button id="reset" class="reset">↻ 重置本节记录</button></section><aside class="panel roster"><div class="roster-head"><div><div class="label">学生名单</div><h2>高一（3）班 <span class="count" id="count"></span></h2></div><span>•••</span></div><label class="upload">⇧ 导入 Excel 名单<input id="file" type="file" accept=".xlsx,.xls"></label><div id="message" class="note"></div><div class="legend"><span class="dot"></span>待点名 <span class="dot yes"></span>已点名</div><div id="list" class="list"></div></aside></section><footer>物理课堂管理 · 保持专注，探索未知</footer></main><script>
const seed=['陈昱安','林知夏','周子墨','王若溪','李星河','张弈鸣','许嘉言','赵雨桐','刘思远','宋清妍','孙浩然','吴思琪'];let roster=seed.map((name,i)=>({id:i+1,name})),called=[],selected=null,busy=false;const $=id=>document.getElementById(id);function render(){const total=roster.length,n=called.length;$('progressText').textContent=`${n} / ${total}`;$('remaining').textContent=total-n;$('progressBar').style.width=(total?100*n/total:0)+'%';$('count').textContent=total;$('list').innerHTML=roster.map(s=>{let yes=called.includes(s.id);return `<button class="student ${selected===s.id?'active':''}" onclick="toggle(${s.id})"><span class="mini">${s.name[0]}</span><span class="name">${s.name}<small>${String(s.id).padStart(2,'0')}</small></span><span class="status ${yes?'yes':''}">${yes?'✓ 已点':'待点'}</span></button>`}).join('')}function toggle(id){called=called.includes(id)?called.filter(x=>x!==id):[...called,id];selected=id;show();render()}function show(){let s=roster.find(x=>x.id===selected);if(!s)return;$('avatar').className='avatar';$('avatar').textContent=s.name[0];$('caption').textContent='本次抽到';$('chosen').textContent=s.name;$('detail').textContent=`学号 ${String(s.id).padStart(2,'0')} · 已记录本次回答`}$('pick').onclick=()=>{let left=roster.filter(s=>!called.includes(s.id));if(!left.length||busy)return;busy=true;$('atom').classList.add('picking');$('pick').disabled=true;$('pick').textContent='随机演算中…';setTimeout(()=>{let s=left[Math.floor(Math.random()*left.length)];selected=s.id;called.push(s.id);busy=false;$('atom').classList.remove('picking');$('pick').disabled=false;$('pick').textContent='✦ 开始随机点名';show();render()},850)};$('reset').onclick=()=>{called=[];selected=null;$('avatar').className='avatar empty';$('avatar').textContent='✦';$('caption').textContent='准备开始点名';$('chosen').textContent='从全班同学中抽取';$('detail').textContent='点击下方按钮，随机点到一位同学';render()};$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});let names=rows.map(r=>String(r[0]||'').trim()).filter(Boolean).filter((n,i)=>!(i===0&&/^(姓名|学生|名字|name)$/i.test(n)));if(!names.length)throw 0;roster=names.map((name,i)=>({id:i+1,name}));called=[];selected=null;$('message').textContent=`已导入 ${roster.length} 位同学`;render()}catch{$('message').textContent='导入失败，请确认首列为学生姓名'}e.target.value=''};render();
</script></body></html>
